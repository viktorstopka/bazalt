name: CI (Windows x64)

# macOS is deferred for the MVP (docs/ARCHITECTURE.md §13) — Windows x64 only
# through M6. RealtimeSanitizer is Clang/macOS-first (ARCHITECTURE.md §8);
# it is NOT run here, on purpose, not by oversight — see the final step
# below. The debug allocation trap (RtAllocationTrap.h) is the RT-safety
# net that actually runs in this CI, via the normal Catch2 suite.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    # Pinned: the project generates for "Visual Studio 17 2022", which
    # windows-latest no longer carries.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache CMake FetchContent deps (JUCE, Catch2)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}

      # JUCE's WebView2 (static) needs the Microsoft.Web.WebView2 NuGet
      # package; the runner doesn't have it. Fetch the exact version JUCE's
      # FindWebView2.cmake asks for and point CMake at it.
      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          $version = "1.0.3485.44"
          $dir = ($env:RUNNER_TEMP -replace "\\", "/") + "/webview2"  # forward slashes: CMake globs this
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile "$env:RUNNER_TEMP/webview2.zip"
          Expand-Archive "$env:RUNNER_TEMP/webview2.zip" -DestinationPath "$dir/Microsoft.Web.WebView2.$version"
          "WEBVIEW2_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ env.WEBVIEW2_DIR }}"

      - name: Build (Debug)
        run: cmake --build build --config Debug --parallel

      - name: Run full test suite (engine + plugin)
        run: ctest --test-dir build -C Debug --output-on-failure

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI install + build
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Validate VST3 with pluginval (strict)
        shell: pwsh
        run: |
          ./pluginval/pluginval.exe --strictness-level 10 --validate "build/plugin/BazaltPlugin_artefacts/Debug/VST3/Bazalt.vst3"

      - name: RealtimeSanitizer coverage
        shell: pwsh
        run: |
          Write-Host "RTSan intentionally not run: Clang/macOS-first tooling (ARCHITECTURE.md §8/§13), macOS CI doesn't exist yet. The debug allocation trap (RtAllocationTrap.h), exercised above via ctest, is this project's RT-safety net until macOS CI lands."
