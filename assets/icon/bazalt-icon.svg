<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <title>Columnar joint</title>
  <defs>
    <linearGradient id="gL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323232"/><stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="gF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222222"/><stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="gR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181818"/><stop offset="1" stop-color="#0F0F0F"/>
    </linearGradient>
    <linearGradient id="gT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A4A"/><stop offset="1" stop-color="#3E3E3E"/>
    </linearGradient>
    <linearGradient id="gEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A4A"/><stop offset="1" stop-color="#4A4A4A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,-10)" stroke-linejoin="round">
    <!-- sides -->
    <path d="M50,58 L75,72.7 L75,177.7 L54,165.4 Q50,163 50,159 Z" fill="url(#gL)"/>
    <path d="M75,72.7 L125,72.7 L125,177.7 Q100,179.6 75,177.7 Z" fill="url(#gF)"/>
    <path d="M125,72.7 L150,58 L150,159 Q150,163 146,165.4 L125,177.7 Z" fill="url(#gR)"/>

    <!-- vertical edge light, fading down -->
    <rect x="74.4" y="72.7" width="1.2" height="80" fill="url(#gEdge)"/>
    <rect x="49.6" y="58" width="1" height="70" fill="url(#gEdge)" opacity="0.6"/>

    <!-- bevel -->
    <polygon points="50,58 75,43.3 81,43 62,56" fill="#5A5A5A"/>
    <polygon points="75,43.3 125,43.3 119,43 81,43" fill="#616161"/>
    <polygon points="125,43.3 150,58 138,56 119,43" fill="#535353"/>
    <polygon points="50,58 75,72.7 81,69 62,56" fill="#444444"/>
    <polygon points="75,72.7 125,72.7 119,69 81,69" fill="#333333"/>
    <polygon points="125,72.7 150,58 138,56 119,69" fill="#222222"/>

    <!-- top face -->
    <polygon points="138,56 119,69 81,69 62,56 81,43 119,43" fill="url(#gT)" stroke="#454545" stroke-width="1"/>

    <!-- rim highlights -->
    <polyline points="50,58 75,43.3 125,43.3 150,58" fill="none" stroke="#6A6A6A" stroke-width="0.8" stroke-linecap="round"/>
    <polyline points="50,58 75,72.7 125,72.7" fill="none" stroke="#505050" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
